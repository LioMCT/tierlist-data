<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoyageTiers | Official Leaderboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-blur: rgba(10, 10, 12, 0.9);
            --card-glass: rgba(25, 25, 30, 0.75);
            --accent: #ffcc00; /* Matching the yellow in your logo */
            --accent-glow: rgba(255, 204, 0, 0.3);
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --status-open: #00ff88;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            color: var(--text-main);
            /* High-quality Minecraft Background with Blur */
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://images.alphacoders.com/134/1343463.png');
            background-size: cover;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 💎 Logo & Header Section */
        .header-section {
            padding: 50px 0 20px 0;
            text-align: center;
        }

        .logo {
            max-width: 400px;
            filter: drop-shadow(0 0 15px rgba(255, 204, 0, 0.5));
            transition: transform 0.3s ease;
        }
        
        .logo:hover {
            transform: scale(1.05);
        }

        /* 🟢 Status Ribbon */
        .status-ribbon {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .status-pill {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot { height: 8px; width: 8px; border-radius: 50%; background: var(--status-open); box-shadow: 0 0 10px var(--status-open); }

        /* 🔍 Search Interface */
        .search-container {
            width: 90%;
            max-width: 1000px;
            margin: 30px 0;
        }

        .search-bar {
            width: 100%;
            padding: 18px 25px;
            background: var(--card-glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            color: white;
            font-size: 1.1rem;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }

        .search-bar:focus {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* 📋 Ultra-Style Leaderboard Card */
        .leaderboard-wrapper {
            width: 90%;
            max-width: 1100px;
            background: var(--card-glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            margin-bottom: 60px;
        }

        table { width: 100%; border-collapse: collapse; }
        
        th {
            background: rgba(255,255,255,0.03);
            padding: 22px;
            text-align: left;
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--text-dim);
            letter-spacing: 1.5px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        td { padding: 18px 22px; border-bottom: 1px solid rgba(255,255,255,0.03); transition: background 0.2s; }

        tr:hover td { background: rgba(255,255,255,0.02); }

        /* 👤 Player Profile Display */
        .player-cell { display: flex; align-items: center; gap: 18px; }
        
        .player-head {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: #222;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .player-name { font-weight: 700; font-size: 1.05rem; }

        /* 🏷️ Tier Badges (Matching UltraTiers) */
        .tier-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.3);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.08);
            margin-right: 8px;
            margin-bottom: 5px;
            font-weight: 800;
            font-size: 0.85rem;
        }

        .tier-badge img { width: 18px; height: 18px; object-fit: contain; }

        .region-tag {
            color: var(--text-dim);
            font-weight: 600;
            font-size: 0.9rem;
            background: rgba(255,255,255,0.05);
            padding: 4px 10px;
            border-radius: 6px;
        }

    </style>
</head>
<body>

    <div class="header-section">
        <img src="https://i.ibb.co/MacePVPlogo.jpg" alt="Voyage Tiers" class="logo">
        <div id="liveStatus" class="status-ribbon"></div>
    </div>

    <div class="search-container">
        <input type="text" id="playerSearch" class="search-bar" placeholder="Search for a player username..." onkeyup="renderUI()">
    </div>

    <div class="leaderboard-wrapper">
        <table>
            <thead>
                <tr>
                    <th width="30%">Player</th>
                    <th width="15%">Region</th>
                    <th width="55%">Gamemode Rankings</th>
                </tr>
            </thead>
            <tbody id="leaderboardBody"></tbody>
        </table>
    </div>

    <script>
        // Mapping gamemodes to Minecraft icons to match UltraTiers aesthetic
        const gmConfig = {
            "Mace": { icon: "https://minecraft.wiki/images/Mace_JE1_BE1.png" },
            "Sword": { icon: "https://minecraft.wiki/images/Netherite_Sword_JE2_BE2.png" },
            "Crystal": { icon: "https://minecraft.wiki/images/End_Crystal_JE2_BE2.png" },
            "Axe": { icon: "https://minecraft.wiki/images/Netherite_Axe_JE2_BE2.png" },
            "UHC": { icon: "https://minecraft.wiki/images/Golden_Apple_JE2_BE2.png" },
            "Bed": { icon: "https://minecraft.wiki/images/Red_Bed_JE4_BE3.png" },
            "SMP": { icon: "https://minecraft.wiki/images/Grass_Block_JE7_BE6.png" }
        };

        let database = {};

        async function loadData() {
            try {
                // Fetch player data
                const res = await fetch('https://raw.githubusercontent.com/LioMCT/tierlist-data/main/tierlist.json?t=' + Date.now());
                database = await res.json();
                
                // Fetch queue status
                const sRes = await fetch('https://raw.githubusercontent.com/LioMCT/tierlist-data/main/status.json?t=' + Date.now());
                renderStatus(await sRes.json());
                
                renderUI();
            } catch(e) { console.error("Failed to load data:", e); }
        }

        function renderStatus(status) {
            const container = document.getElementById('liveStatus');
            container.innerHTML = "";
            for(const [gm, regs] of Object.entries(status)) {
                for(const [reg, state] of Object.entries(regs)) {
                    if(state === "OPEN") {
                        container.innerHTML += `<div class="status-pill"><span class="dot"></span> ${gm} • ${reg}</div>`;
                    }
                }
            }
        }

        function renderUI() {
            const body = document.getElementById('leaderboardBody');
            const query = document.getElementById('playerSearch').value.toLowerCase();
            body.innerHTML = "";

            Object.keys(database).sort().forEach(name => {
                if(!name.toLowerCase().includes(query)) return;
                const data = database[name];
                
                let tierHTML = "";
                for(const [mode, rank] of Object.entries(data.tiers)) {
                    const icon = gmConfig[mode] ? `<img src="${gmConfig[mode].icon}">` : "⚔️";
                    tierHTML += `<div class="tier-badge">${icon} ${rank}</div>`;
                }

                body.innerHTML += `
                    <tr>
                        <td>
                            <div class="player-cell">
                                <img class="player-head" src="https://crafatar.com/avatars/${name}?size=44&overlay">
                                <div class="player-name">${name}</div>
                            </div>
                        </td>
                        <td><span class="region-tag">${data.region || 'EU'}</span></td>
                        <td>${tierHTML}</td>
                    </tr>`;
            });
        }

        // Initial Load and Auto-Refresh every 30 seconds
        loadData();
        setInterval(loadData, 30000);
    </script>
</body>
</html>
