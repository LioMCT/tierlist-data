<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoyageTiers | Global Leaderboard</title>
    <style>
        :root {
            --bg-color: #0f1113;
            --card-bg: #1a1d21;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent: #3498db;
            --success: #2ecc71;
            --danger: #e74c3c;
            
            /* Gamemode Colors */
            --color-mace: #9b59b6;
            --color-smp: #2ecc71;
            --color-sword: #3498db;
            --color-spear: #e67e22;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .header-section { text-align: center; margin-bottom: 20px; }
        h1 { font-size: 2.5rem; margin: 0; color: var(--accent); }
        
        /* Live Status Bar */
        .status-ribbon {
            display: flex;
            gap: 15px;
            background: #252a30;
            padding: 10px 20px;
            border-radius: 50px;
            margin-bottom: 25px;
            font-size: 0.85rem;
            border: 1px solid #333;
        }
        .status-item { display: flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
        .dot.open { background: var(--success); box-shadow: 0 0 8px var(--success); }
        .dot.closed { background: var(--danger); }

        .search-container {
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
        }

        .search-bar {
            width: 100%;
            padding: 12px 25px;
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 30px;
            color: white;
            outline: none;
            transition: 0.3s;
        }
        .search-bar:focus { border-color: var(--accent); }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .tab-btn {
            background: var(--card-bg);
            border: 1px solid #333;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .tab-btn.active { background: var(--accent); border-color: var(--accent); }

        .mode-icon { width: 18px; height: 18px; object-fit: contain; }

        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        table { width: 100%; border-collapse: collapse; }
        th { background: #252a30; padding: 15px; text-align: left; color: var(--text-secondary); font-size: 0.8rem; }
        td { padding: 12px 15px; border-bottom: 1px solid #2d3238; }

        .player-cell { display: flex; align-items: center; gap: 12px; }
        .player-head { width: 32px; height: 32px; border-radius: 4px; }

        .rank-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 0.85rem;
            font-weight: bold;
            gap: 6px;
        }
        .badge-mace { background: rgba(155, 89, 182, 0.15); color: var(--color-mace); border: 1px solid var(--color-mace); }

        .footer { margin-top: 30px; color: var(--text-secondary); font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="header-section">
        <h1>VoyageTiers</h1>
        <div id="liveStatus" class="status-ribbon">
            <span style="color: #666;">Loading Live Status...</span>
        </div>
    </div>

    <div class="search-container">
        <input type="text" id="playerSearch" class="search-bar" placeholder="Search for a player..." onkeyup="renderUI()">
    </div>
    
    <div class="tabs" id="tabContainer">
        <button class="tab-btn active" onclick="updateTable('all', this)">🌐 Overall</button>
        <button class="tab-btn" onclick="updateTable('Mace', this)">Mace</button>
        <button class="tab-btn" onclick="updateTable('SMP', this)">SMP</button>
    </div>

    <div class="container">
        <table>
            <thead>
                <tr id="headerRow">
                    <th>Player</th>
                    <th>Region</th>
                    <th>Ranks</th>
                </tr>
            </thead>
            <tbody id="leaderboardBody"></tbody>
        </table>
    </div>

    <div class="footer" id="lastUpdated">Last Sync: --:--</div>

    <script>
        const config = {
            "Mace": { emoji: "https://minecraft.wiki/images/Mace_JE1_BE1.png", class: "badge-mace" },
            "SMP": { emoji: "🌲", class: "badge-smp" }
        };

        let rawData = {};
        let currentMode = 'all';

        function getIcon(mode) {
            const cfg = config[mode];
            if (!cfg) return "";
            return cfg.emoji.startsWith('http') ? `<img src="${cfg.emoji}" class="mode-icon">` : cfg.emoji;
        }

        async function fetchData() {
            try {
                // Fetch Data
                const res = await fetch('https://raw.githubusercontent.com/LioMCT/tierlist-data/main/tierlist.json?t=' + Date.now());
                rawData = await res.json();
                
                // Fetch Status
                const statusRes = await fetch('https://raw.githubusercontent.com/LioMCT/tierlist-data/main/status.json?t=' + Date.now());
                const statusData = await statusRes.json();
                
                renderStatus(statusData);
                renderUI();
                document.getElementById('lastUpdated').innerText = "Last Sync: " + new Date().toLocaleTimeString();
            } catch (e) { console.error(e); }
        }

        function renderStatus(status) {
            const container = document.getElementById('liveStatus');
            container.innerHTML = "";
            // Show first 4 gamemodes that are "OPEN"
            let openCount = 0;
            for(const [gm, regions] of Object.entries(status)) {
                for(const [reg, state] of Object.entries(regions)) {
                    if(state === "OPEN" && openCount < 4) {
                        container.innerHTML += `
                            <div class="status-item">
                                <div class="dot open"></div>
                                <span>${gm} (${reg})</span>
                            </div>`;
                        openCount++;
                    }
                }
            }
            if(openCount === 0) container.innerHTML = '<div class="status-item"><div class="dot closed"></div><span>All Queues Closed</span></div>';
        }

        function updateTable(mode, btn) {
            currentMode = mode;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderUI();
        }

        function renderUI() {
            const body = document.getElementById('leaderboardBody');
            const search = document.getElementById('playerSearch').value.toLowerCase();
            body.innerHTML = "";

            const players = Object.keys(rawData)
                .map(name => ({ username: name, ...rawData[name] }))
                .filter(p => p.username.toLowerCase().includes(search));

            players.forEach(p => {
                if (currentMode !== 'all' && !p.tiers[currentMode]) return;
                
                let ranksHTML = "";
                if (currentMode === 'all') {
                    for (const [gm, tier] of Object.entries(p.tiers)) {
                        const cfg = config[gm] || { class: "" };
                        ranksHTML += `<span class="rank-badge ${cfg.class}">${getIcon(gm)} ${tier}</span> `;
                    }
                } else {
                    const cfg = config[currentMode];
                    ranksHTML = `<span class="rank-badge ${cfg.class}">${getIcon(currentMode)} ${p.tiers[currentMode]}</span>`;
                }

                body.innerHTML += `
                    <tr>
                        <td>
                            <div class="player-cell">
                                <img class="player-head" src="https://crafatar.com/avatars/${p.username}?size=32&overlay">
                                <strong>${p.username}</strong>
                            </div>
                        </td>
                        <td><span class="region-tag">${p.region || '??'}</span></td>
                        <td>${ranksHTML}</td>
                    </tr>`;
            });
        }

        fetchData();
        setInterval(fetchData, 30000); // Update every 30s
    </script>
</body>
</html>
