<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoyageTiers | Official Leaderboard</title>
    <style>
        :root {
            --bg-blur: rgba(15, 17, 19, 0.85);
            --card-glass: rgba(26, 29, 33, 0.7);
            --accent: #00d2ff;
            --accent-glow: rgba(0, 210, 255, 0.4);
            --text-main: #ffffff;
            --text-dim: #b0b0b0;
            --status-open: #00ff88;
            --status-closed: #ff4d4d;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            margin: 0;
            color: var(--text-main);
            /* This adds a cool Minecraft-style blurred background */
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                        url('https://images.alphacoders.com/134/1343463.png');
            background-size: cover;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 💎 Glassmorphism Header */
        .header-container {
            width: 100%;
            padding: 40px 0;
            text-align: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }

        h1 {
            font-size: 3rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0;
            background: linear-gradient(to right, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        /* 🔍 Search & Status */
        .controls {
            width: 90%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .search-bar {
            width: 100%;
            padding: 15px 25px;
            background: var(--card-glass);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            outline: none;
            transition: 0.3s;
        }

        .search-bar:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* 📋 The Leaderboard Card */
        .leaderboard-card {
            width: 90%;
            max-width: 1000px;
            background: var(--card-glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            margin-bottom: 50px;
        }

        table { width: 100%; border-collapse: collapse; }
        
        th {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            text-align: left;
            text-transform: uppercase;
            font-size: 0.8rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        td { padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        /* 👤 Player Styling */
        .player-info { display: flex; align-items: center; gap: 15px; }
        
        .player-head {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.1);
        }

        /* 🏷️ Badge Styling (Matching UltraTiers) */
        .badge {
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .badge img { width: 16px; height: 16px; }

        /* Status Bar */
        .status-ribbon {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .status-pill {
            background: rgba(0,0,0,0.4);
            padding: 8px 15px;
            border-radius: 50px;
            font-size: 0.8rem;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .dot.online { background: var(--status-open); box-shadow: 0 0 8px var(--status-open); }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>VoyageTiers</h1>
        <div id="liveStatus" class="status-ribbon"></div>
    </div>

    <div class="controls">
        <input type="text" id="playerSearch" class="search-bar" placeholder="Search for a champion..." onkeyup="renderUI()">
    </div>

    <div class="leaderboard-card">
        <table>
            <thead>
                <tr>
                    <th>Player</th>
                    <th>Region</th>
                    <th>Rankings</th>
                </tr>
            </thead>
            <tbody id="leaderboardBody"></tbody>
        </table>
    </div>

    <script>
        const config = {
            "Mace": { emoji: "https://minecraft.wiki/images/Mace_JE1_BE1.png", color: "#9b59b6" },
            "SMP": { emoji: "🌲", color: "#2ecc71" }
        };

        let rawData = {};

        async function init() {
            try {
                const res = await fetch('https://raw.githubusercontent.com/LioMCT/tierlist-data/main/tierlist.json?t=' + Date.now());
                rawData = await res.json();
                
                const sRes = await fetch('https://raw.githubusercontent.com/LioMCT/tierlist-data/main/status.json?t=' + Date.now());
                renderStatus(await sRes.json());
                renderUI();
            } catch(e) { console.error(e); }
        }

        function renderStatus(status) {
            const container = document.getElementById('liveStatus');
            container.innerHTML = "";
            for(const [gm, regs] of Object.entries(status)) {
                for(const [reg, state] of Object.entries(regs)) {
                    if(state === "OPEN") {
                        container.innerHTML += `<div class="status-pill"><span class="dot online"></span>${gm} (${reg})</div>`;
                    }
                }
            }
        }

        function renderUI() {
            const body = document.getElementById('leaderboardBody');
            const search = document.getElementById('playerSearch').value.toLowerCase();
            body.innerHTML = "";

            Object.keys(rawData).forEach(name => {
                if(!name.toLowerCase().includes(search)) return;
                const p = rawData[name];
                
                let badges = "";
                for(const [gm, tier] of Object.entries(p.tiers)) {
                    const cfg = config[gm] || { emoji: "⚔️" };
                    const icon = cfg.emoji.includes('http') ? `<img src="${cfg.emoji}">` : cfg.emoji;
                    badges += `<div class="badge">${icon} ${tier}</div> `;
                }

                body.innerHTML += `
                    <tr>
                        <td>
                            <div class="player-info">
                                <img class="player-head" src="https://crafatar.com/avatars/${name}?size=40&overlay">
                                <strong>${name}</strong>
                            </div>
                        </td>
                        <td><span style="color:var(--text-dim)">${p.region || 'EU'}</span></td>
                        <td>${badges}</td>
                    </tr>`;
            });
        }

        init();
        setInterval(init, 30000);
    </script>
</body>
</html>
